<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Leaflet Map Local Test</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <style>
      #leaflet {
        width: 100%;
        height: 80vh;
        background: #eee;
      }
      body {
        font-family: sans-serif;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <h2>그라파나 지도 로컬 테스트용</h2>
    <div id="leaflet"></div>

    <script type="module">
      // 1. Leaflet 로드
      import * as LeafletModule from "https://esm.sh/leaflet";

      // [중요] 모듈 객체는 수정이 불가능하므로, 전역 객체 L에 복사하여 할당합니다.
      // 이렇게 해야 플러그인들이 L.AwesomeMarkers 등을 추가할 수 있습니다.
      window.L = { ...(LeafletModule.default || LeafletModule) };
      // 위 방식이 안될 경우 대비한 표준 방식
      Object.assign(window.L, LeafletModule);

      // 2. 플러그인 로드 (이제 전역 L 객체를 찾아가서 수정합니다)
      await import("https://esm.sh/leaflet.awesome-markers");
      await import("https://esm.sh/leaflet.markercluster");

      // 3. Mock 데이터 설정 (이전과 동일)
      const mockContext = {
        data: [
          [
            // 1. 연결 성공 + 마운트 타입 (beige)
            {
              device_id: "Sensor_01",
              device_type: "mount",
              connection: true,
              alias: "정상 마운트",
              location: JSON.stringify({
                type: "Feature",
                geometry: { type: "Point", coordinates: [127.001, 37.501] },
              }),
            },
            // 2. 연결 실패 + 부이 타입 (lightgray)
            {
              device_id: "Sensor_02",
              device_type: "buoy",
              connection: false,
              alias: "연결끊김 부이",
              location: JSON.stringify({
                type: "Feature",
                geometry: { type: "Point", coordinates: [127.002, 37.502] },
              }),
            },
            // 3. 현재 선택된 센서 (orange) - replaceVariables에서 Sensor_03을 반환하도록 설정할 것
            {
              device_id: "Sensor_03",
              device_type: "portable",
              connection: true,
              alias: "선택된 장비",
              location: JSON.stringify({
                type: "Feature",
                geometry: { type: "Point", coordinates: [127.003, 37.503] },
              }),
            },
            // 4. 클러스터 테스트용 밀집 데이터 (같은 구역)
            {
              device_id: "Sensor_04",
              device_type: "default",
              connection: true,
              alias: "밀집 1",
              location: JSON.stringify({
                type: "Feature",
                geometry: { type: "Point", coordinates: [127.0015, 37.5015] },
              }),
            },
            {
              device_id: "Sensor_05",
              device_type: "mount",
              connection: false,
              alias: "밀집 2",
              location: JSON.stringify({
                type: "Feature",
                geometry: { type: "Point", coordinates: [127.0018, 37.5018] },
              }),
            },
          ],
        ],
        grafana: {
          replaceVariables: (str) => {
            if (str.includes("Sensor")) return "Sensor_03"; // 3번 센서를 선택 상태로 만듦
            if (str.includes("MapMarker")) return "";
            return str;
          },
          locationService: { partial: (p) => console.log("변수 변경:", p) },
        },
        element: {
          querySelector: (s) => document.querySelector(s),
          parentElement: { parentElement: { clientHeight: 800 } },
        },
      };

      // 4. 로컬 map-logic.js 실행
      import { renderMap } from "./map-logic.js";

      try {
        // window.L을 넘겨주어 map-logic 내부에서도 같은 객체를 쓰게 합니다.
        renderMap(mockContext, window.L);
        console.log("로컬 테스트 렌더링 성공!");
      } catch (e) {
        console.error("렌더링 에러:", e);
      }
    </script>
  </body>
</html>
